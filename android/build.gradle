plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.marketingcloudsdk'
version = '55.0.1'

android {
  namespace "expo.modules.marketingcloudsdk"
  defaultConfig {
    versionCode 1
    versionName "55.0.1"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  maven { url "https://salesforce-marketingcloud.github.io/MarketingCloudSDK-Android/repository" }
}

dependencies {
  implementation 'host.exp.exponent:expo.modules.notifications:[55.0.20,)'
  implementation 'com.facebook.react:react-native:+'
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
  api "com.salesforce.marketingcloud:marketingcloudsdk:9.0.4"
}
